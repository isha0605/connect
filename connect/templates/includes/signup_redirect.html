<div class="page-card-body text-center">
	<p class="text-muted">{{ _("Create a Connect account to get matched with a partner or manage your listing.") }}</p>
</div>
<div class="page-card-actions">
	<a id="connect-signup-cta" href="/signup" class="btn btn-sm btn-primary btn-block">
		{{ _("Continue to Sign Up") }}
	</a>
	<p class="text-center sign-up-message">
		<a href="#login" class="blue">{{ _("Have an account? Login") }}</a>
	</p>
</div>
<script>
	(function () {
		var link = document.getElementById("connect-signup-cta");
		if (!link) return;
		var params = new URLSearchParams(window.location.search);
		var redirectTo = params.get("redirect-to");
		if (redirectTo) {
			link.href = "/signup?redirect-to=" + encodeURIComponent(redirectTo);
		}
	})();
</script>
