<h1 class="email-header-title">{{ heading }}</h1>
<p>{{ _("Enter this code in Frappe Connect to continue.") }}</p>
<div class="verification-code" style="font-size: 28px; font-weight: 600; letter-spacing: 6px; margin: 16px 0;">{{ code }}</div>
<p class="text-muted text-small">
	{{ _("It expires in {0} minutes. If you didn't ask for it, you can ignore this email.").format(expires_minutes or 10) }}
</p>
